name: Governance Gate

on:
  push:
    branches: [main]
  pull_request_target:
    branches: [main]

permissions:
  contents: read

jobs:
  trusted-self-test:
    if: github.event_name == 'push'
    name: governance-gate-self-test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Compile trusted validator
        run: python -m py_compile gate/approval_manifest.py gate/validate.py

  governance-gate:
    if: github.event_name == 'pull_request_target'
    name: governance-gate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout trusted base
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          path: trusted
          persist-credentials: false

      - name: Checkout exact candidate data
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          path: candidate
          fetch-depth: 0
          persist-credentials: false

      - name: Restrict candidate changes to the approval manifest
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          git -C candidate fetch origin "$BASE_SHA" --depth=1
          changed="$(git -C candidate diff --name-only "$BASE_SHA" "$HEAD_SHA")"
          printf '%s\n' "$changed"
          test "$changed" = "approval/manifest.json"

      - name: Validate candidate manifest with trusted base policy
        run: |
          python trusted/gate/validate.py \
            candidate/approval/manifest.json \
            trusted/governance/state.json
